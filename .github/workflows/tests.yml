name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  # === Stage 1: Show variables (аналог show_variables) ===
  pre:
    name: Show variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Print environment variables
        run: printenv | sort

  # === Stage 2: Lint ===
  lint:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-root --with dev

      - name: Run black formatter check
        run: poetry run black --check .

      - name: Run ruff linter
        run: poetry run ruff check --output-format=github --target-version=py311 .

  # === Stage 3: Blackbox tests ===
  blackbox-tests:
    name: Run Blackbox Tests
    runs-on: ubuntu-latest
    needs: [lint] # выполняется после линтера
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build . -t app

      - name: Make tests executable
        run: chmod +x tests/run.sh

      - name: Run blackbox tests
        run: ./tests/run.sh tests/cases
